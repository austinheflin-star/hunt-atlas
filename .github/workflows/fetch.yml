name: fetch-assets
on:
  push:
    branches: [fetch-assets]
    paths: [tools/**, .github/workflows/fetch.yml]
permissions:
  contents: write
jobs:
  pkgtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          npm i playwright@1.48.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node tools/pkgtest.js
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add out/pkg && git commit -m "Test package" && git push
