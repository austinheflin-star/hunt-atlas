name: fetch-assets
on:
  push:
    branches: [fetch-assets]
    paths: [tools/**, .github/workflows/fetch.yml]
permissions:
  contents: write
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash tools/route.sh
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add out/route && git commit -m "Route" && git push || true
