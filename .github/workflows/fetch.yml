name: fetch-assets
on:
  push:
    branches: [fetch-assets]
    paths: [tools/**, .github/workflows/fetch.yml]
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { run-id: 42687179178, github-token: "${{ github.token }}", path: art, pattern: "tx-*", merge-multiple: true }
      - run: |
          mkdir -p out/tx && cp art/*.txt out/tx/ && ls -la out/tx
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add out/tx && git commit -m "Transcripts" && git push
