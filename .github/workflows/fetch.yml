name: fetch-assets
on:
  push:
    branches: [fetch-assets]
    paths: [tools/**, .github/workflows/fetch.yml]
permissions:
  contents: write
jobs:
  yt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          bash tools/yt.sh
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add out/yt && git commit -m "YouTube transcript" && git push || true
