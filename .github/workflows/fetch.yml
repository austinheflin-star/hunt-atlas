name: fetch-assets
on:
  push:
    branches: [fetch-assets]
    paths: [tools/**, .github/workflows/fetch.yml]
permissions:
  contents: write
jobs:
  som3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          pip install -q pillow
          python tools/som3.py
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add out/som3 && git commit -m "Somerville wide mosaic" && git push || true
